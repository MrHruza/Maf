<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/139e951f-5808-491f-9637-c25227c8115f">
    <title>Majnuj | Hlavní stránka</title>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Fredoka:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            background-color: #1f1f27;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            scroll-behavior: smooth;
        }

        /* NAVBAR */
        .navbar-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background-color: #1f1f27;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            padding: 0 30px;
        }

        .navbar-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-logo img {
            height: 48px;
            width: auto;
            border-radius: 8px;
        }

        .navbar-menu {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-item {
            color: #b5b9c4;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            color: #ffffff;
        }

        .nav-btn-shop {
            background-color: #ffcc00;
            color: #000000;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 800;
            padding: 12px 28px;
            border-radius: 12px;
            text-transform: uppercase;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .nav-btn-shop:hover {
            background-color: #e6b800;
            transform: scale(1.03);
        }

        /* HERO SEKCE */
        .hero-section {
            background: url('https://www.minecraft.net/content/dam/minecraftnet/archive/6581250e483233ceb023d260eef9ed6a-header.jpg') no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding-top: 80px;
            box-sizing: border-box;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 25px;
            z-index: 2;
        }

        .hero-logo {
            max-width: 90%;
            width: 750px;
            height: auto;
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .hero-play-btn {
            font-family: 'Fredoka', sans-serif;
            background-color: #f0b638;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 18px 45px;
            border-radius: 16px;
            box-shadow: 0 6px 0 #d49f2c, 0 12px 25px rgba(0,0,0,0.25);
            text-transform: uppercase;
            transition: transform 0.1s ease;
        }

        .hero-play-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .hero-ip-box {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 10px 24px;
            border-radius: 30px;
            color: #1e3153;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        /* UVÍTACÍ SEKCE */
        .welcome-section {
            padding: 80px 20px;
            display: flex;
            justify-content: center;
        }

        .welcome-container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .text-content {
            flex: 1;
        }

        .text-content h1 {
            color: #f0b638;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .text-content p {
            color: #b5b9c4;
            line-height: 1.7;
            font-size: 1rem;
        }

        @media (max-width: 900px) {
            .welcome-container { flex-direction: column; }
        }
    </style>
</head>
<body>

<header class="navbar-header">
    <div class="navbar-container">
        <a href="index.html" class="navbar-logo">
            <img src="https://github.com/user-attachments/assets/a9ccd4a1-d413-4bf6-add4-5685f5153ea8" alt="Majnuj Logo">
        </a>
        <nav class="navbar-menu">
           <a href="index.html" class="nav-item active">Domů</a>
           <a href="pravidla.html" class="nav-item">Pravidla</a>
           <a href="team.html" class="nav-item">Tým</a>
           <a href="https://discord.com/invite/n7PsVuE2Pu" target="_blank" class="nav-item">Discord</a>
        </nav>
        <a href="https://obchod.majnuj.eu" class="nav-btn-shop">Obchod</a>
    </div>
</header>

<section class="hero-section">
    <div class="hero-content">
        <img src="https://github.com/user-attachments/assets/a9ccd4a1-d413-4bf6-add4-5685f5153ea8" alt="Majnuj Logo" class="hero-logo">
        <a href="https://discord.com/invite/n7PsVuE2Pu" class="hero-play-btn">CHCI JÍT HRÁT!</a>
        <div class="hero-ip-box" onclick="navigator.clipboard.writeText('majnuj.eu'); alert('IP adresa byla zkopírována!');">
            <i class="fa-solid fa-copy"></i>
            <span>MAJNUJ.EU</span>
        </div>
    </div>
</section>

<section class="welcome-section">
    <div class="welcome-container">
        <div class="video-wrapper">
            <iframe src="https://www.youtube-nocookie.com/embed/mSNHL1A054A?rel=0" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="text-content">
            <h1>Vítej na Majnuj.eu!</h1>
            <p>Jsme Minecraft server se zaměřením na kvalitní herní zážitek pro celou komunitu. Nabízíme propracovaný Survival, Skyblock, Oneblock a zábavné PvP minihry.</p>
            <p>Připoj se k nám ještě dnes a zažij jedinečné dobrodružství!</p>
        </div>
    </div>
</section>

</body>
</html>
